name: Build & Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Always use stable rust
        run: rustup update stable && rustc --version
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
